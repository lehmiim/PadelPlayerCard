<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miika's Padel Club – Pelaajakortti</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      overflow-x: hidden;
    }
    .font-teko {
      font-family: 'Teko', sans-serif;
    }

    /* Metallinhohtoinen, läpikuultava ja hologrammityylinen kortti */
    .rank-card-hologram {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.65) 0%, rgba(15, 23, 42, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 0 25px rgba(56, 189, 248, 0.15);
      position: relative;
      overflow: hidden;
    }

    /* Hologrammi / sateenkaari- ja metalliheijastus liukuen */
    .rank-card-hologram::before {
      content: '';
      position: absolute;
      top: -150%;
      left: -150%;
      width: 400%;
      height: 400%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(56, 189, 248, 0.08) 48%,
        rgba(251, 191, 36, 0.12) 50%,
        rgba(236, 72, 153, 0.08) 52%,
        transparent 55%
      );
      transform: rotate(25deg);
      animation: holo-shine 7s infinite linear;
      pointer-events: none;
    }

    @keyframes holo-shine {
      0% { transform: translateY(-100%) rotate(25deg); }
      50% { transform: translateY(100%) rotate(25deg); }
      100% { transform: translateY(-100%) rotate(25deg); }
    }

    /* Kimalle/syke-efekti teksteille */
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.4)); }
      50% { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.85)); }
    }
    .glitter-text {
      animation: pulse-glow 3s infinite ease-in-out;
    }

    /* Taustahiukkaset / hohto */
    .ambient-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- Taustan hohtoa -->
  <div class="ambient-glow -top-20 -left-20"></div>
  <div class="ambient-glow -bottom-20 -right-20"></div>

  <div class="w-full max-w-md z-10 space-y-6 text-center">
    <!-- Pieni ylälogo -->
    <div>
      <h1 class="font-teko text-3xl font-bold tracking-wide text-amber-400 drop-shadow">
        MIIKA'S PADEL CLUB
      </h1>
      <p class="text-xs text-sky-300 font-semibold uppercase tracking-widest">Henkilökohtainen Pelaajakortti</p>
    </div>

    <!-- PÄÄKORTTI (Metallinen hologrammiefekti & läpikuultavuus) -->
    <div id="player-card-container" class="rank-card-hologram rounded-3xl p-8 shadow-2xl space-y-6">
      
      <!-- Pelaajan Nimi -->
      <div>
        <h2 id="card-player-name" class="text-4xl font-black text-white tracking-wide drop-shadow-md">Ladataan...</h2>
        <p id="card-player-status" class="text-xs text-slate-400 mt-1">Haetaan pelaajatietoja pilvestä...</p>
      </div>

      <!-- Rank Kuvake & Animaatioalue -->
      <div class="py-4 relative flex flex-col items-center justify-center">
        <div class="absolute inset-0 bg-sky-500/10 rounded-full filter blur-xl animate-pulse"></div>
        
        <!-- Rank Icon / Visuaalinen symboli -->
        <div id="card-rank-badge" class="text-6xl mb-3 transform hover:scale-110 transition duration-300 drop-shadow-lg">
          🏆
        </div>
        
        <!-- Rank Nimi -->
        <div id="card-rank-name" class="font-teko text-4xl sm:text-5xl font-extrabold text-amber-400 glitter-text uppercase tracking-wider">
          --
        </div>
      </div>

      <!-- Tilastoruudukko (Läpikuultavat metallilaatikot) -->
      <div class="grid grid-cols-3 gap-3 pt-4 border-t border-white/10 text-center">
        <div class="bg-slate-900/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-inner">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">MMR</div>
          <div id="card-mmr" class="text-xl font-black text-amber-400 mt-0.5">0</div>
        </div>
        <div class="bg-slate-900/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-inner">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Voittoprosentti</div>
          <div id="card-winpct" class="text-xl font-black text-emerald-400 mt-0.5">0%</div>
        </div>
        <div class="bg-slate-900/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-inner">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Ottelut</div>
          <div id="card-matches" class="text-xl font-black text-white mt-0.5">0</div>
        </div>
      </div>

    </div>

    <!-- Ohjeteksti -->
    <div id="select-hint" class="text-xs text-slate-500">
      Kortti päivittyy automaattisesti pilvestä henkilökohtaisen tunnisteen (tokenin) perusteella.
    </div>
  </div>

  <script>
    // API-osoite Google Sheetsiin (sama kuin pääsovelluksessa)
    const API_URL = "https://script.google.com/macros/s/AKfycbzBS031Z_0HplzgNsp_uJeuNx0jzfN5tvwc8zG8KRqH8kMcDWyNiETtAUQHhQvx4ztq/exec";

    // Apufunktio rankin laskemiseen
    function getRank(player) {
      const uniqueSessions = player.playedDates ? player.playedDates.length : 0;
      
      if (!player.hasAchievedRank && uniqueSessions < 5) {
        return { name: 'Unranked ❓', color: 'text-slate-500 font-normal', isUnranked: true, badge: '❓' };
      }

      const mmr = player.mmr;
      if (mmr >= 1800) return { name: 'Suurmestari 🌌', color: 'text-fuchsia-400', badge: '🌌' };
      if (mmr >= 1700) return { name: 'Mestari III 👑', color: 'text-amber-300', badge: '👑' };
      if (mmr >= 1600) return { name: 'Mestari II 👑', color: 'text-amber-400', badge: '👑' };
      if (mmr >= 1500) return { name: 'Mestari I 👑', color: 'text-amber-500', badge: '👑' };
      if (mmr >= 1400) return { name: 'Timantti III 💎', color: 'text-cyan-300', badge: '💎' };
      if (mmr >= 1300) return { name: 'Timantti II 💎', color: 'text-cyan-400', badge: '💎' };
      if (mmr >= 1200) return { name: 'Timantti I 💎', color: 'text-cyan-500', badge: '💎' };
      if (mmr >= 1100) return { name: 'Platina III 💿', color: 'text-teal-200', badge: '💿' };
      if (mmr >= 1000) return { name: 'Platina II 💿', color: 'text-teal-300', badge: '💿' };
      if (mmr >= 900)  return { name: 'Platina I 💿', color: 'text-teal-400', badge: '💿' };
      if (mmr >= 800)  return { name: 'Kulta III 🥇', color: 'text-yellow-300', badge: '🥇' };
      if (mmr >= 700)  return { name: 'Kulta II 🥇', color: 'text-yellow-400', badge: '🥇' };
      if (mmr >= 600)  return { name: 'Kulta I 🥇', color: 'text-yellow-500', badge: '🥇' };
      if (mmr >= 500)  return { name: 'Hopea III 🥈', color: 'text-slate-200', badge: '🥈' };
      if (mmr >= 400)  return { name: 'Hopea II 🥈', color: 'text-slate-300', badge: '🥈' };
      if (mmr >= 300)  return { name: 'Hopea I 🥈', color: 'text-slate-400', badge: '🥈' };
      if (mmr >= 200)  return { name: 'Pronssi III 🥉', color: 'text-amber-600', badge: '🥉' };
      if (mmr >= 100)  return { name: 'Pronssi II 🥉', color: 'text-amber-700', badge: '🥉' };
      return { name: 'Pronssi I 🥉', color: 'text-amber-800', badge: '🥉' };
    }

    window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const playerNameParam = urlParams.get('player'); // Tukee myös vanhaa nimihakua varalla

      try {
        const response = await fetch(API_URL);
        const players = await response.json();

        if (!Array.isArray(players) || players.length === 0) {
          throw new Error("Ei pelaajia");
        }

        let player = null;
        if (token) {
          player = players.find(p => p.token === token);
        }
        if (!player && playerNameParam) {
          player = players.find(p => p.name.toLowerCase() === playerNameParam.toLowerCase());
        }
        // Jos ei kumpaakaan löydy, näytetään listan ensimmäinen
        if (!player) {
          player = players[0];
        }

        // Päivitetään tiedot kortille
        document.getElementById('card-player-name').textContent = player.name;
        document.getElementById('card-mmr').textContent = player.mmr;
        document.getElementById('card-matches').textContent = player.matches;
        
        const winPct = player.matches > 0 ? Math.round((player.wins / player.matches) * 100) : 0;
        document.getElementById('card-winpct').textContent = winPct + '%';

        const rankInfo = getRank(player);
        document.getElementById('card-rank-name').textContent = rankInfo.name;
        document.getElementById('card-rank-badge').textContent = rankInfo.badge;

        const sessions = player.playedDates ? player.playedDates.length : 0;
        if (rankInfo.isUnranked) {
          document.getElementById('card-player-status').textContent = `Unranked (${sessions}/5 pelisessiota vaadittu)`;
        } else {
          document.getElementById('card-player-status').textContent = `Aktiivinen Ranking-pelaaja`;
        }

      } catch (err) {
        console.error("Virhe haettaessa tietoja pilvestä:", err);
        document.getElementById('card-player-name').textContent = "Virhe ladattaessa";
        document.getElementById('card-player-status').textContent = "Tietojen haku pilvestä epäonnistui.";
      }
    };
  </script>
</body>
</html>
