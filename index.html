<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miika's Padel Club – Pelaajakortti</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      overflow-x: hidden;
    }
    .font-teko {
      font-family: 'Teko', sans-serif;
    }

    /* Metallinhohtoinen, läpikuultava ja hologrammityylinen kortti */
    .rank-card-hologram {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.65) 0%, rgba(15, 23, 42, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 0 25px rgba(56, 189, 248, 0.15);
      position: relative;
      overflow: hidden;
    }

    /* Hologrammi / sateenkaari- ja metalliheijastus liukuen */
    .rank-card-hologram::before {
      content: '';
      position: absolute;
      top: -150%;
      left: -150%;
      width: 400%;
      height: 400%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(56, 189, 248, 0.08) 48%,
        rgba(251, 191, 36, 0.12) 50%,
        rgba(236, 72, 153, 0.08) 52%,
        transparent 55%
      );
      transform: rotate(25deg);
      animation: holo-shine 7s infinite linear;
      pointer-events: none;
    }

    @keyframes holo-shine {
      0% { transform: translateY(-100%) rotate(25deg); }
      50% { transform: translateY(100%) rotate(25deg); }
      100% { transform: translateY(-100%) rotate(25deg); }
    }

    /* Kimalle/syke-efekti teksteille */
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.4)); }
      50% { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.85)); }
    }
    .glitter-text {
      animation: pulse-glow 3s infinite ease-in-out;
    }

    /* Taustahiukkaset / hohto */
    .ambient-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    /* --- TÄYSIN SULAVA JA KIRKAS 3D-PYÖRIMINEN --- */
    .rank-3d-container {
      perspective: 800px;
      display: inline-block;
      position: relative;
      width: 120px;
      height: 120px;
      transform-style: preserve-3d;
      will-change: transform;
      animation: float-and-bounce 6s infinite linear;
    }

    @keyframes float-and-bounce {
      0% { 
        transform: translateY(0px) rotateX(6deg) rotateY(0deg); 
      }
      25% { 
        transform: translateY(-8px) rotateX(0deg) rotateY(90deg); 
      }
      50% { 
        transform: translateY(-12px) rotateX(-6deg) rotateY(180deg); 
      }
      75% { 
        transform: translateY(-8px) rotateX(0deg) rotateY(270deg); 
      }
      100% { 
        transform: translateY(0px) rotateX(6deg) rotateY(360deg); 
      }
    }

    .rank-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .layer-back {
      transform: translateZ(-6px) scale(0.98);
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
    }

    .layer-mid {
      transform: translateZ(-3px) scale(0.99);
    }

    @keyframes icon-glitter {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)) drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4)); }
      50% { filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.9)) drop-shadow(0 15px 25px rgba(236, 72, 153, 0.4)); }
    }

    .layer-front {
      transform: translateZ(0px) scale(1);
      animation: icon-glitter 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- Taustan hohtoa -->
  <div class="ambient-glow -top-20 -left-20"></div>
  <div class="ambient-glow -bottom-20 -right-20"></div>

  <div class="w-full max-w-md z-10 space-y-6 text-center">
    <!-- Pieni ylälogo -->
    <div>
      <h1 class="font-teko text-3xl font-bold tracking-wide text-amber-400 drop-shadow">
        MIIKA'S PADEL CLUB
      </h1>
      <p class="text-xs text-sky-300 font-semibold uppercase tracking-widest">Henkilökohtainen Pelaajakortti</p>
    </div>

    <!-- PÄÄKORTTI -->
    <div id="player-card-container" class="rank-card-hologram rounded-3xl p-8 shadow-2xl space-y-6">

      <!-- Pelaajan Nimi -->
      <div>
        <h2 id="card-player-name" class="text-4xl font-black text-white tracking-wide drop-shadow-md">Ladataan...</h2>
        <p id="card-player-status" class="text-xs text-slate-400 mt-1">Haetaan pelaajatietoja pilvestä...</p>
      </div>

      <!-- Rank Kuvake & Animaatioalue -->
      <div class="py-4 relative flex flex-col items-center justify-center">
        <div class="absolute inset-0 bg-sky-500/10 rounded-full filter blur-xl animate-pulse"></div>

        <!-- Itsetoimiva 3D-kerrospinalo glitterillä ja pomppimisella -->
        <div class="rank-3d-container mb-3" id="icon-container">
          <img id="card-rank-img-back" src="https://lehmiim.github.io/PadelPlayerCard/RankIcons/unranked.png" alt="" class="rank-layer layer-back">
          <img id="card-rank-img-mid" src="https://lehmiim.github.io/PadelPlayerCard/RankIcons/unranked.png" alt="" class="rank-layer layer-mid">
          <img id="card-rank-img-front" src="https://lehmiim.github.io/PadelPlayerCard/RankIcons/unranked.png" alt="Rank Icon" class="rank-layer layer-front">
        </div>

        <!-- Rank Nimi -->
        <div id="card-rank-name" class="font-teko text-4xl sm:text-5xl font-extrabold text-amber-400 glitter-text uppercase tracking-wider">
          --
        </div>
      </div>

      <!-- Tilastoruudukko -->
      <div class="grid grid-cols-3 gap-3 pt-4 border-t border-white/10 text-center">
        <div class="bg-slate-900/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-inner">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">MMR</div>
          <div id="card-mmr" class="text-xl font-black text-amber-400 mt-0.5">0</div>
        </div>
        <div class="bg-slate-900/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-inner">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Voitto%</div>
          <div id="card-winpct" class="text-xl font-black text-emerald-400 mt-0.5">0%</div>
        </div>
        <div class="bg-slate-900/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-inner">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Ottelut</div>
          <div id="card-matches" class="text-xl font-black text-white mt-0.5">0</div>
        </div>
      </div>

      <!-- Vireystila Valopalkki -->
      <div class="mt-4 pt-4 border-t border-white/10">
        <div class="w-full h-3.5 bg-slate-950/90 rounded-full p-0.5 border border-white/10 relative overflow-hidden shadow-inner">
          <div id="player-form-light-bar" class="h-full rounded-full transition-all duration-700 relative" style="width: 100%; background: #475569;">
            <div class="absolute inset-0 bg-gradient-to-t from-transparent via-white/25 to-transparent rounded-full pointer-events-none"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Ohjeteksti -->
    <div id="select-hint" class="text-xs text-slate-500">
      Kortti päivittyy automaattisesti pilvestä henkilökohtaisen tunnisteen (tokenin) perusteella.
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyaIu-1CUxG05OXcuRIHz_Pz53bO3cEjKHHvMaFVWT32Jc13GFyC1Lfq111et-sq7_S/exec";
    const GITHUB_ICON_BASE = "https://lehmiim.github.io/PadelPlayerCard/RankIcons/";

    function getRank(player) {
      const uniqueSessions = player.playedDates ? player.playedDates.length : 0;

      if (!player.hasAchievedRank && uniqueSessions < 5) {
        return { 
          name: 'Unranked', 
          color: 'text-slate-500 font-normal', 
          isUnranked: true, 
          img: 'unranked.png' 
        };
      }

      const mmr = player.mmr;
      let name = '';
      let color = '';
      let img = '';

      if (mmr >= 1800) { name = 'Suurmestari'; color = 'text-fuchsia-400 font-extrabold'; img = 'suurmestari1.png'; }
      else if (mmr >= 1700) { name = 'Mestari III'; color = 'text-amber-300 font-bold'; img = 'mestari3.png'; }
      else if (mmr >= 1600) { name = 'Mestari II'; color = 'text-amber-400 font-bold'; img = 'mestari2.png'; }
      else if (mmr >= 1500) { name = 'Mestari I'; color = 'text-amber-500 font-bold'; img = 'mestari1.png'; }
      else if (mmr >= 1400) { name = 'Timantti III'; color = 'text-cyan-300 font-bold'; img = 'timantti3.png'; }
      else if (mmr >= 1300) { name = 'Timantti II'; color = 'text-cyan-400 font-bold'; img = 'timantti2.png'; }
      else if (mmr >= 1200) { name = 'Timantti I'; color = 'text-cyan-500 font-bold'; img = 'timantti1.png'; }
      else if (mmr >= 1100) { name = 'Platina III'; color = 'text-teal-200 font-semibold'; img = 'platina3.png'; }
      else if (mmr >= 1000) { name = 'Platina II'; color = 'text-teal-300 font-semibold'; img = 'platina2.png'; }
      else if (mmr >= 900)  { name = 'Platina I'; color = 'text-teal-400 font-semibold'; img = 'platina1.png'; }
      else if (mmr >= 800)  { name = 'Kulta III'; color = 'text-yellow-300 font-semibold'; img = 'kulta3.png'; }
      else if (mmr >= 700)  { name = 'Kulta II'; color = 'text-yellow-400 font-semibold'; img = 'kulta2.png'; }
      else if (mmr >= 600)  { name = 'Kulta I'; color = 'text-yellow-500 font-semibold'; img = 'kulta1.png'; }
      else if (mmr >= 500)  { name = 'Hopea III'; color = 'text-slate-200'; img = 'hopea3.png'; }
      else if (mmr >= 400)  { name = 'Hopea II'; color = 'text-slate-300'; img = 'hopea2.png'; }
      else if (mmr >= 300)  { name = 'Hopea I'; color = 'text-slate-400'; img = 'hopea1.png'; }
      else if (mmr >= 200)  { name = 'Pronssi III'; color = 'text-amber-600'; img = 'pronssi3.png'; }
      else if (mmr >= 100)  { name = 'Pronssi II'; color = 'text-amber-700'; img = 'pronssi2.png'; }
      else { name = 'Pronssi I'; color = 'text-amber-800'; img = 'pronssi1.png'; }

      return { name, color, img };
    }

    /**
     * Päivittää vireystilan valopalkin (Light Bar)
     */
    function updatePlayerFormLightBar(playerMatches) {
      const barElement = document.getElementById('player-form-light-bar');
      if (!barElement) return;

      const recentMatches = (playerMatches || []).slice(-10);
      const matchCount = recentMatches.length;

      if (matchCount === 0) {
        barElement.style.width = '100%';
        barElement.style.background = '#475569';
        barElement.style.boxShadow = 'none';
        return;
      }

      let totalScore = 0;
      recentMatches.forEach(m => {
        const res = typeof m === 'string' ? m : (m.result || (m.scoreA > m.scoreB ? 'WIN' : (m.scoreA === m.scoreB ? 'DRAW' : 'LOSS')));
        if (res === 'WIN') totalScore += 1.0;
        else if (res === 'DRAW') totalScore += 0.5;
      });

      const formRatio = totalScore / matchCount; 
      let hue = formRatio * 120; // 0 = punainen, 120 = vihreä

      const maturityFactor = matchCount / 10; 
      const saturation = Math.round(30 + (maturityFactor * 60)); 
      const lightness = Math.round(65 - (maturityFactor * 15)); 

      const barColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
      
      barElement.style.width = '100%';
      barElement.style.background = barColor;

      const glowAlpha = 0.2 + (maturityFactor * 0.5);
      barElement.style.boxShadow = `0 0 14px ${barColor.replace(')', `, ${glowAlpha})`).replace('hsl', 'hsla')}`;
    }

    window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        document.getElementById('card-player-name').textContent = "Pääsy evätty";
        document.getElementById('card-player-status').textContent = "Henkilökohtainen tunniste (token) puuttuu osoitteesta.";
        return;
      }

      try {
        const response = await fetch(`${API_URL}?token=${token}`);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        let player = data;

        if (!player || (!player.id && !player.name)) {
          throw new Error("Pelaajaa ei löytynyt");
        }

        document.getElementById('card-player-name').textContent = player.name;
        document.getElementById('card-mmr').textContent = player.mmr || 0;
        document.getElementById('card-matches').textContent = player.matches || 0;

        const totalMatches = player.matches || 0;
        const wins = player.wins || 0;
        const losses = player.losses || 0;
        const draws = Math.max(0, totalMatches - wins - losses);

        const effectiveWins = wins + (draws * 0.5);
        const winPct = totalMatches > 0 ? Math.round((effectiveWins / totalMatches) * 100) : 0;
        document.getElementById('card-winpct').textContent = winPct + '%';

        const rankInfo = getRank(player);

        const rankNameElem = document.getElementById('card-rank-name');
        rankNameElem.textContent = rankInfo.name;
        rankNameElem.className = `font-teko text-4xl sm:text-5xl font-extrabold glitter-text uppercase tracking-wider ${rankInfo.color}`;

        const fullImgUrl = `${GITHUB_ICON_BASE}${rankInfo.img}`;
        document.getElementById('card-rank-img-back').src = fullImgUrl;
        document.getElementById('card-rank-img-mid').src = fullImgUrl;
        document.getElementById('card-rank-img-front').src = fullImgUrl;
        document.getElementById('card-rank-img-front').alt = rankInfo.name;

        const seasonNum = data.currentSeason || 1;
        const sessions = player.playedDates ? player.playedDates.length : 0;
        if (rankInfo.isUnranked) {
          document.getElementById('card-player-status').textContent = `Kausi ${seasonNum} - Unranked (${sessions}/5 pelisessiota pelattu)`;
        } else {
          document.getElementById('card-player-status').textContent = `Kausi ${seasonNum} - Aktiivinen pelaaja`;
        }

        // Päivitetään vireystilan valopalkki
        updatePlayerFormLightBar(player.matchesHistory || player.recentMatches || []);

      } catch (err) {
        console.error("Virhe haettaessa tietoja pilvestä:", err);
        document.getElementById('card-player-name').textContent = "Pääsy evätty";
        document.getElementById('card-player-status').textContent = "Tunnistautuminen epäonnistui (token puuttuu tai on virheellinen).";
        document.getElementById('card-rank-name').textContent = "VIRHE";
        document.getElementById('card-mmr').textContent = "-";
        document.getElementById('card-winpct').textContent = "-";
        document.getElementById('card-matches').textContent = "-";
      }
    };
  </script>
</body>
</html>
